[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin_judge"
description = "PenguinJudge Backend API Server"
version = "1.4.0"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "Kazuki Oikawa" }, { email = "k@oikw.org" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi >= 0.97, < 1",
  "uvicorn[standard] >=0.22.0,<0.23.0",
  "sqlalchemy[asyncio] >= 2.0.16, < 2.1",
  "psycopg[binary,pool] >= 3.1, < 4",
  "pika >= 1.3.2, < 1.4",
  "aiormq >= 6.7.6, < 8",
  "zstandard >= 0.21.0, < 1",
  "docker >= 6.1.3, < 7",
  "pyyaml >= 6.0, < 7",
  "msgpack >= 1.0.5, < 1.1",
  "python-multipart >= 0.0.6, < 0.1",
  "alembic >= 1.11.1, < 2",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-cov", "pysen", "mypy", "black", "isort", "flake8", "sqlalchemy[mypy]"]

[project.scripts]
penguin_judge = "penguin_judge.main:main"

[tool.pytest.ini_options]
addopts = "--cov=penguin_judge --cov-report html --cov-report term"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.pysen]
version = "0.10"

[tool.pysen.lint]
enable_black = true
enable_flake8 = true
enable_isort = true
enable_mypy = true
mypy_preset = "very_strict"
line_length = 88
py_version = "py310"
isort_known_first_party = ["penguin_judge"]
[[tool.pysen.lint.mypy_targets]]
  paths = ["penguin_judge", "tests"]

[tool.mypy]
plugins = [
  "pydantic.mypy",
  "sqlalchemy.ext.mypy.plugin",
]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
